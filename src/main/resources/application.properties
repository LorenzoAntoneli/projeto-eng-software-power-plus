spring.application.name=power-plus-mvp
server.port=8080

# Banco H2 local
spring.datasource.url=jdbc:h2:file:./data/powerplus-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracoes gerais
powerplus.features.whatsapp-enabled=false
powerplus.seed.enabled=true

# Credenciais do painel definidas via variaveis de ambiente (com padrao local de desenvolvimento)
powerplus.auth.owner-username=${POWERPLUS_ADMIN_USER:leonardo.powerplus}
powerplus.auth.owner-default-password=${POWERPLUS_ADMIN_PASS:PowerPlus@2026}
