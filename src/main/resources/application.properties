spring.application.name=power-plus-mvp
server.port=8080

# Persistencia H2 em arquivo local (dados preservados entre reinicializacoes locais)
spring.datasource.url=jdbc:h2:file:./data/powerplus-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Feature Flags (Parte V - DevOps)
powerplus.features.whatsapp-enabled=false
powerplus.seed.enabled=true

# Credenciais iniciais do proprietario (hash BCrypt gerado na inicializacao)
powerplus.auth.owner-username=carlos.powerplus
powerplus.auth.owner-default-password=PowerPlus@2026
