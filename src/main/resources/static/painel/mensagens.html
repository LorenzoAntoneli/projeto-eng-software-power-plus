<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens — Gestão Power Plus</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="backoffice-layout">
        <aside class="backoffice-sidebar" id="boSidebarMount"></aside>

        <main class="backoffice-main">
            <div class="bo-header">
                <div>
                    <div class="page-eyebrow">Relacionamento</div>
                    <h1>Central de mensagens recebidas</h1>
                    <p>Histórico da triagem online e chamados encaminhados pelos clientes para retorno direto do Leonardo.</p>
                </div>
            </div>

            <div class="inbox-container">
                <div class="inbox-Master" id="mountListaConversas"></div>
                <div class="inbox-Detail" id="mountDetalheConversa">
                    <div class="empty-placeholder" style="margin:auto 0">
                        Selecione uma conversa na lista à esquerda para visualizar o histórico e enviar sua resposta técnica.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/core.js"></script>
    <script src="/js/painel-mensagens.js"></script>
</body>
</html>
