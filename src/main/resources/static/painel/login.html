<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Operacional — Power Plus</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="login-page">
        <div class="login-panel">
            <img src="/img/logo-powerplus.svg" alt="Power Plus Engenharia e Serviços Elétricos" class="login-logo">
            <h1>Acesso Operacional</h1>
            <p>Área restrita ao responsável técnico para aprovação de visitas, controle de expediente e gestão de clientes.</p>

            <form id="formLoginPainel">
                <div class="field">
                    <label for="loginUser">Usuário operacional</label>
                    <input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="loginPass">Senha de acesso</label>
                    <input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="btnEntrarPainel" style="margin-top:6px">Acessar painel de gestão</button>
            </form>

            <div class="login-back">
                <a href="/">Voltar ao portal do cliente</a>
                <span>Ribeirão Preto · SP</span>
            </div>
        </div>
    </main>

    <script src="/js/core.js"></script>
    <script src="/js/painel-login.js"></script>
</body>
</html>
