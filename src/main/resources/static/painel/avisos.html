<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Avisos — Gestão Power Plus</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="backoffice-layout">
        <aside class="backoffice-sidebar" id="boSidebarMount"></aside>

        <main class="backoffice-main">
            <div class="bo-header">
                <div>
                    <div class="page-eyebrow">Auditoria de Comunicação</div>
                    <h1>Registro de avisos e notificações</h1>
                    <p>Log operacional de solicitações recebidas, aprovações, recusas, remarcações e lembretes emitidos.</p>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" id="btnMarcarTodasLidas">Confirmar leitura de todos</button>
            </div>

            <div class="surface-box">
                <div id="mountTabelaAvisos"></div>
            </div>
        </main>
    </div>

    <script src="/js/core.js"></script>
    <script src="/js/painel-avisos.js"></script>
</body>
</html>
